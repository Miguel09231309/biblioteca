        const [isAuthOpen, setIsAuthOpen] = useState(false);
        const [defaultAuthRole, setDefaultAuthRole] = useState('aluno');

        const currentRole = currentUser?.role || 'aluno';

        const handleToggleRole = () => {
          if (currentRole === 'aluno') {
            const lib = users.find((u) => u.role === 'bibliotecaria');
            if (lib) {
              setCurrentUser(lib);
              setActiveTab('circulacao');
            } else {
              setDefaultAuthRole('bibliotecaria');
              setIsAuthOpen(true);
            }
          } else {
            const student = users.find((u) => u.role === 'aluno');
            if (student) {
              setCurrentUser(student);
              setActiveTab('acervo');
            } else {
              setDefaultAuthRole('aluno');
              setIsAuthOpen(true);
            }
          }
        };

        const handleDownloadStandaloneHtml = async () => {
          try {
            if (window.location.protocol.startsWith('http')) {
              const res = await fetch(window.location.href);
              if (res.ok) {
                const htmlText = await res.text();
                const blob = new Blob([htmlText], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'index.html';
                a.click();
                return;
              }
            }
          } catch (e) {}
          const docHtml = '<!doctype html>\n' + document.documentElement.outerHTML;
          const blob = new Blob([docHtml], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'index.html';
          a.click();
        };

        return (
          <div className="min-h-screen bg-[#FDFBF7] text-[#1E1612] flex flex-col font-sans selection:bg-[#681A24]/20 selection:text-[#380E14]">
            <div className="bg-[#2D0B10] text-[#EFE8DC] text-xs py-2 px-4 border-b border-[#4A121A]">
              <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
                <div className="flex items-center gap-2">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400" />
                  <span>
                    Ambiente de Navegação:{' '}
                    <strong className="text-white font-serif">
                      {currentUser ? `${currentUser.name} (${currentUser.role === 'bibliotecaria' ? 'Bibliotecária' : 'Aluno'})` : 'Visitante'}
                    </strong>
                  </span>
                </div>

                <div className="flex flex-wrap items-center justify-center gap-2.5 sm:gap-3">
                  <button
                    onClick={handleDownloadStandaloneHtml}
                    className="px-2.5 py-1 rounded-sm bg-[#681A24] hover:bg-[#7E1F2C] text-white font-semibold text-[11px] flex items-center gap-1.5 transition-colors shadow-xs border border-[#C99757]/30"
                    title="Baixar arquivo index.html único autônomo para rodar direto no navegador sem servidor"
                  >
                    <Download className="w-3 h-3 text-[#E5B869]" />
                    <span>Baixar index.html Único</span>
                  </button>
                  <button
                    onClick={() => setActiveTab('sql-database')}
                    className={`px-2.5 py-1 rounded-sm text-[11px] font-semibold flex items-center gap-1.5 transition-colors border ${
                      activeTab === 'sql-database'
                        ? 'bg-[#C99757] text-[#24080D] font-bold border-[#C99757]'
                        : 'bg-[#4A121A] text-[#E5B869] border-[#C99757]/40 hover:bg-[#5C1620] shadow-xs'
                    }`}
                  >
                    <Database className="w-3 h-3 text-[#E5B869]" />
                    <span>Console MySQL</span>
                  </button>
                  <button
                    onClick={handleToggleRole}
                    className="px-2.5 py-1 rounded-sm bg-white/10 hover:bg-white/15 text-[#E5B869] font-semibold text-[11px] flex items-center gap-1.5 transition-colors border border-white/10"
                  >
                    <ArrowRightLeft className="w-3 h-3" />
                    <span>Alternar para {currentRole === 'aluno' ? 'Bibliotecária' : 'Aluno'}</span>
                  </button>
                  <button
                    onClick={() => {
                      setDefaultAuthRole(currentRole === 'aluno' ? 'bibliotecaria' : 'aluno');
                      setIsAuthOpen(true);
                    }}
                    className="text-[11px] text-stone-400 hover:text-white underline"
                  >
                    Identificação & Cadastros
                  </button>
                </div>
              </div>
            </div>

            <Navbar
              onOpenAuth={() => setIsAuthOpen(true)}
              activeTab={activeTab}
              setActiveTab={setActiveTab}
            />

            {/* Barra Mobile Rápida */}
            <div className="md:hidden bg-[#FAF8F5] border-b border-[#E6DFC4] px-4 py-2 flex items-center gap-2 overflow-x-auto text-xs font-medium">
              {currentRole !== 'bibliotecaria' ? (
                <>
                  <button onClick={() => setActiveTab('acervo')} className={`px-3 py-1.5 rounded-lg shrink-0 ${activeTab === 'acervo' ? 'bg-[#4A121A] text-white font-bold' : 'text-stone-700'}`}>Acervo</button>
                  <button onClick={() => setActiveTab('meus-emprestimos')} className={`px-3 py-1.5 rounded-lg shrink-0 ${activeTab === 'meus-emprestimos' ? 'bg-[#4A121A] text-white font-bold' : 'text-stone-700'}`}>Meus Empréstimos</button>
                  <button onClick={() => setActiveTab('sql-database')} className={`px-3 py-1.5 rounded-lg shrink-0 ${activeTab === 'sql-database' ? 'bg-[#4A121A] text-white font-bold' : 'text-stone-700'}`}>MySQL</button>
                </>
              ) : (
                <>
                  <button onClick={() => setActiveTab('circulacao')} className={`px-3 py-1.5 rounded-lg shrink-0 ${activeTab === 'circulacao' ? 'bg-[#4A121A] text-white font-bold' : 'text-stone-700'}`}>Circulação</button>
                  <button onClick={() => setActiveTab('inventario')} className={`px-3 py-1.5 rounded-lg shrink-0 ${activeTab === 'inventario' ? 'bg-[#4A121A] text-white font-bold' : 'text-stone-700'}`}>Acervo</button>
                  <button onClick={() => setActiveTab('relatorios')} className={`px-3 py-1.5 rounded-lg shrink-0 ${activeTab === 'relatorios' ? 'bg-[#4A121A] text-white font-bold' : 'text-stone-700'}`}>Relatórios</button>
                  <button onClick={() => setActiveTab('sql-database')} className={`px-3 py-1.5 rounded-lg shrink-0 ${activeTab === 'sql-database' ? 'bg-[#4A121A] text-white font-bold' : 'text-stone-700'}`}>SQL</button>
                  <button onClick={() => setActiveTab('configuracoes')} className={`px-3 py-1.5 rounded-lg shrink-0 ${activeTab === 'configuracoes' ? 'bg-[#4A121A] text-white font-bold' : 'text-stone-700'}`}>Config</button>
                </>
              )}
            </div>

            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-6 sm:pt-8">
              {activeTab === 'sql-database' ? (
                <MySqlConsole />
              ) : currentRole === 'aluno' ? (
                <StudentPortal
                  onSelectBook={(book) => setSelectedBook(book)}
                  onOpenAuth={() => setIsAuthOpen(true)}
                  activeTab={activeTab}
                  setActiveTab={setActiveTab}
                />
              ) : (
                <LibrarianPortal
                  activeTab={activeTab}
                  setActiveTab={setActiveTab}
                  onOpenBookDetail={(book) => setSelectedBook(book)}
                />
              )}
            </main>

            <BookDetailModal
              book={selectedBook}
              onClose={() => setSelectedBook(null)}
              onOpenAuth={() => setIsAuthOpen(true)}
            />

            <AuthModal
              isOpen={isAuthOpen}
              onClose={() => setIsAuthOpen(false)}
              defaultRole={defaultAuthRole}
            />

            <footer className="mt-auto bg-[#1C1612] text-[#D4C5B3] border-t border-[#3E2B1E] text-xs">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                <div className="grid grid-cols-1 md:grid-cols-4 gap-8">
                  <div className="space-y-3">
                    <div className="flex items-center gap-2">
                      <div className="w-8 h-8 rounded-md bg-[#2D0B10] border border-[#B47836]/30 flex items-center justify-center text-[#E8D7C3]">
                        <span className="font-serif font-bold text-base italic">B</span>
                      </div>
                      <span className="font-serif font-bold text-lg text-white">
                        Biblio<span className="text-[#C89B65] italic font-normal">Saber</span>
                      </span>
                    </div>
                    <p className="text-stone-400 leading-relaxed text-[11px]">
                      Plataforma integrada de curadoria literária, circulação de acervo físico e gestão relacional para comunidades escolares e universitárias.
                    </p>
                    <div className="flex items-center gap-1.5 text-[11px] text-[#C89B65] font-mono">
                      <Database className="w-3.5 h-3.5" />
                      <span>Motor Relacional SQL Ativo (Modo Autônomo Browser)</span>
                    </div>
                  </div>

                  <div>
                    <h4 className="font-serif font-bold text-white text-sm mb-3">Políticas Institucionais</h4>
                    <ul className="space-y-1.5 text-stone-400 text-[11px]">
                      <li>&bull; Prazo padrão de leitura: <strong className="text-stone-200">{settings.standardLoanDays} dias corridos</strong></li>
                      <li>&bull; Multa por atraso configurada: <strong className="text-stone-200">R$ {settings.dailyFineAmount.toFixed(2)} / dia</strong></li>
                      <li>&bull; Tolerância de carência: <strong className="text-stone-200">{settings.gracePeriodDays} dia(s)</strong></li>
                      <li>&bull; Máximo simultâneo por aluno: <strong className="text-stone-200">{settings.maxBooksPerStudent} obras</strong></li>
                      <li>&bull; Renovações online: <strong className="text-stone-200">{settings.maxRenewalsAllowed} vezes permitidas</strong></li>
                    </ul>
                  </div>

                  <div>
                    <h4 className="font-serif font-bold text-white text-sm mb-3">Portais e Cadastros</h4>
                    <ul className="space-y-2 text-[11px]">
                      <li>
                        <button
                          onClick={() => { setDefaultAuthRole('aluno'); setIsAuthOpen(true); }}
                          className="text-stone-300 hover:text-white flex items-center gap-1.5"
                        >
                          <GraduationCap className="w-3.5 h-3.5 text-[#C89B65]" />
                          <span>Cadastro de Aluno (Matrícula Escolar)</span>
                        </button>
                      </li>
                      <li>
                        <button
                          onClick={() => { setDefaultAuthRole('bibliotecaria'); setIsAuthOpen(true); }}
                          className="text-stone-300 hover:text-white flex items-center gap-1.5"
                        >
                          <ShieldCheck className="w-3.5 h-3.5 text-emerald-400" />
                          <span>Acesso da Bibliotecária (Institucional)</span>
                        </button>
                      </li>
                    </ul>
                  </div>

                  <div>
                    <h4 className="font-serif font-bold text-white text-sm mb-3">Atendimento & Informações</h4>
                    <p className="text-stone-400 text-[11px] leading-relaxed">
                      {settings.institutionName}<br />
                      {settings.libraryName}<br />
                      Atendimento: <a href={`mailto:${settings.contactEmail}`} className="text-[#C89B65] hover:underline">{settings.contactEmail}</a><br />
                      Horário: Segunda a Sexta, das 07h30 às 21h30.
                    </p>
                  </div>
                </div>

                <div className="mt-10 pt-6 border-t border-white/10 flex flex-col sm:flex-row items-center justify-between text-[11px] text-stone-500 gap-2">
                  <p>&copy; {new Date().getFullYear()} BiblioSaber · Todos os direitos reservados.</p>
                  <p>Atelier Biblioteconômico Autônomo · Arquivo Único HTML5 + React + Tailwind + MySQL Engine</p>
                </div>
              </div>
            </footer>
          </div>
        );
      };

      const App = () => (
        <LibraryProvider>
          <LibraryAppContent />
        </LibraryProvider>
      );

      const rootElement = document.getElementById('root');
      if (rootElement) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
      }
    </script>
  </body>
</html>
