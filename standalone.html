-- BIBLIOSABER - SISTEMA DE GESTÃO DE BIBLIOTECA
-- DUMP MYSQL 8.0+ / MARIADB / POSTGRESQL READY
-- ====================================================================

CREATE DATABASE IF NOT EXISTS bibliosaber_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
USE bibliosaber_db;

CREATE TABLE IF NOT EXISTS users (
  id VARCHAR(64) PRIMARY KEY,
  name VARCHAR(255) NOT NULL,
  email VARCHAR(255) NOT NULL UNIQUE,
  role ENUM('aluno', 'bibliotecaria') NOT NULL,
  registration_number VARCHAR(64) NOT NULL UNIQUE,
  course_or_department VARCHAR(255),
  phone VARCHAR(32),
  is_blocked BOOLEAN NOT NULL DEFAULT FALSE,
  created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

CREATE TABLE IF NOT EXISTS books (
  id VARCHAR(64) PRIMARY KEY,
  title VARCHAR(255) NOT NULL,
  author VARCHAR(255) NOT NULL,
  genre VARCHAR(100) NOT NULL,
  isbn VARCHAR(32) NOT NULL UNIQUE,
  published_year INT NOT NULL,
  publisher VARCHAR(255),
  total_copies INT NOT NULL DEFAULT 1,
  available_copies INT NOT NULL DEFAULT 1,
  location VARCHAR(128) NOT NULL,
  cover_url TEXT NOT NULL,
  pages INT NOT NULL DEFAULT 100
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

CREATE TABLE IF NOT EXISTS loans (
  id VARCHAR(64) PRIMARY KEY,
  book_id VARCHAR(64) NOT NULL,
  user_id VARCHAR(64) NOT NULL,
  request_date TIMESTAMP NOT NULL,
  due_date TIMESTAMP NOT NULL,
  return_date TIMESTAMP NULL,
  status ENUM('pendente', 'aprovado', 'devolvido', 'recusado') NOT NULL,
  fine_amount DECIMAL(10,2) NOT NULL DEFAULT 0.00,
  fine_paid BOOLEAN NOT NULL DEFAULT FALSE,
  FOREIGN KEY (book_id) REFERENCES books(id) ON DELETE CASCADE,
  FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
`;
        const booksInserts = books.map(b => 
          `INSERT INTO books (id, title, author, genre, isbn, published_year, total_copies, available_copies, location) VALUES ('${b.id}', '${b.title.replace(/'/g, "''")}', '${b.author.replace(/'/g, "''")}', '${b.genre}', '${b.isbn}', ${b.publishedYear}, ${b.totalCopies}, ${b.availableCopies}, '${b.location}');`
        ).join('\n');

        return `${ddl}\n-- DADOS ATUAIS DO ACERVO:\n${booksInserts}\n\n-- FIM DO DUMP MYSQL`;
      }

      static execute(query, tables) {
        const start = performance.now();
        const clean = query.trim().replace(/;$/, '');
        const upper = clean.toUpperCase();

        try {
          if (upper.startsWith('SELECT')) {
            let data = [];
            if (upper.includes('FROM BOOKS')) {
              data = tables.books.map(b => ({ id: b.id, titulo: b.title, autor: b.author, genero: b.genre, total: b.totalCopies, disponiveis: b.availableCopies, local: b.location }));
            } else if (upper.includes('FROM USERS')) {
              data = tables.users.map(u => ({ id: u.id, nome: u.name, email: u.email, papel: u.role, matricula: u.registrationNumber, bloqueado: u.isBlocked ? 'SIM' : 'NÃO' }));
            } else if (upper.includes('FROM LOANS')) {
              data = tables.loans.map(l => ({ id: l.id, livro: l.bookTitle, aluno: l.userName, status: l.status, vencimento: l.dueDate.slice(0, 10), multa: `R$ ${l.fineAmount.toFixed(2)}` }));
            } else {
              data = tables.books.map(b => ({ id: b.id, titulo: b.title, autor: b.author, disponiveis: b.availableCopies }));
            }

            if (upper.includes('WHERE')) {
              if (upper.includes('AVAILABLE_COPIES > 0') || upper.includes('DISPONIVEIS > 0')) data = data.filter(r => (r.disponiveis ?? 0) > 0);
              if (upper.includes('AVAILABLE_COPIES = 0') || upper.includes('DISPONIVEIS = 0')) data = data.filter(r => (r.disponiveis ?? 0) === 0);
              if (upper.includes("STATUS = 'APROVADO'")) data = data.filter(r => String(r.status).toLowerCase() === 'aprovado');
              if (upper.includes("ROLE = 'ALUNO'") || upper.includes("PAPEL = 'ALUNO'")) data = data.filter(r => String(r.papel).toLowerCase() === 'aluno');
            }

            const columns = data.length > 0 ? Object.keys(data[0]) : ['Resultado'];
            return {
              columns,
              rows: data,
              rowCount: data.length,
              latency: Number((performance.now() - start).toFixed(2)),
              message: `${data.length} registro(s) retornado(s) com sucesso.`
            };
          }

          if (upper.startsWith('SHOW TABLES')) {
            return {
              columns: ['Tables_in_bibliosaber_db', 'Engine', 'Linhas'],
              rows: [
                { Tables_in_bibliosaber_db: 'books', Engine: 'InnoDB', Linhas: tables.books.length },
                { Tables_in_bibliosaber_db: 'users', Engine: 'InnoDB', Linhas: tables.users.length },
                { Tables_in_bibliosaber_db: 'loans', Engine: 'InnoDB', Linhas: tables.loans.length },
                { Tables_in_bibliosaber_db: 'reservations', Engine: 'InnoDB', Linhas: tables.reservations.length },
                { Tables_in_bibliosaber_db: 'system_settings', Engine: 'InnoDB', Linhas: 1 },
              ],
              rowCount: 5,
              latency: Number((performance.now() - start).toFixed(2)),
            };
          }

          return {
            columns: ['Comando', 'Status'],
            rows: [{ Comando: clean.slice(0, 35) + '...', Status: 'Comando SQL aceito pelo motor MySQL 8.0.' }],
            rowCount: 1,
            latency: Number((performance.now() - start).toFixed(2)),
          };
        } catch (e) {
          return { columns: ['Erro'], rows: [], rowCount: 0, latency: 0, error: e.message };
        }
      }
    }

    // ====================================================================
    // 4. CONTEXTO DE ESTADO DA BIBLIOTECA

    const LibraryContext = createContext();

    const LibraryProvider = ({ children }) => {
      const STORAGE_KEY = 'bibliosaber_standalone_v1';

      const [users, setUsers] = useState(() => {
        const s = localStorage.getItem(`${STORAGE_KEY}_users`);
        return s ? JSON.parse(s) : SEED_USERS;
      });

      const [currentUser, setCurrentUser] = useState(() => {
        const s = localStorage.getItem(`${STORAGE_KEY}_current_user`);
        return s ? JSON.parse(s) : SEED_USERS[1]; // Lucas (Aluno)
      });

      const [books, setBooks] = useState(() => {
        const s = localStorage.getItem(`${STORAGE_KEY}_books`);
        return s ? JSON.parse(s) : SEED_BOOKS;
      });

      const [loans, setLoans] = useState(() => {
        const s = localStorage.getItem(`${STORAGE_KEY}_loans`);
        return s ? JSON.parse(s) : SEED_LOANS;
      });

      const [reservations, setReservations] = useState(() => {
        const s = localStorage.getItem(`${STORAGE_KEY}_reservations`);
        return s ? JSON.parse(s) : SEED_RESERVATIONS;
      });

      const [notifications, setNotifications] = useState(() => {
        const s = localStorage.getItem(`${STORAGE_KEY}_notifications`);
        return s ? JSON.parse(s) : SEED_NOTIFICATIONS;
      });

      const [settings, setSettings] = useState(() => {
        const s = localStorage.getItem(`${STORAGE_KEY}_settings`);
        return s ? JSON.parse(s) : INITIAL_SETTINGS;
      });

      // Salva em localStorage a cada alteração
      useEffect(() => {
        localStorage.setItem(`${STORAGE_KEY}_users`, JSON.stringify(users));
        localStorage.setItem(`${STORAGE_KEY}_books`, JSON.stringify(books));
        localStorage.setItem(`${STORAGE_KEY}_loans`, JSON.stringify(loans));
        localStorage.setItem(`${STORAGE_KEY}_reservations`, JSON.stringify(reservations));
        localStorage.setItem(`${STORAGE_KEY}_notifications`, JSON.stringify(notifications));
        localStorage.setItem(`${STORAGE_KEY}_settings`, JSON.stringify(settings));
        if (currentUser) {
          localStorage.setItem(`${STORAGE_KEY}_current_user`, JSON.stringify(currentUser));
        }
      }, [users, books, loans, reservations, notifications, settings, currentUser]);

      // Ações de Negócio
      const requestLoan = (bookId) => {
        const book = books.find(b => b.id === bookId);
        if (!book || book.availableCopies <= 0) return { success: false, message: 'Exemplar indisponível para empréstimo.' };

        const newLoan = {
          id: `loan-${Date.now()}`,
          bookId: book.id,
          bookTitle: book.title,
          bookCover: book.coverUrl,
          userId: currentUser.id,
          userName: currentUser.name,
          userEmail: currentUser.email,
          userRegistration: currentUser.registrationNumber,
          requestDate: new Date().toISOString(),
          dueDate: addDays(new Date(), settings.standardLoanDays),
          status: 'pendente',
          renewalsCount: 0,
          fineAmount: 0,
          finePaid: false,
          notes: 'Solicitação online via portal do aluno',
        };

        setLoans(prev => [newLoan, ...prev]);
        return { success: true, message: `Solicitação para "${book.title}" enviada! Aguarde a aprovação da bibliotecária.` };
      };

      const approveLoan = (loanId) => {
        const loan = loans.find(l => l.id === loanId);
        if (!loan) return { success: false, message: 'Empréstimo não encontrado.' };
        const book = books.find(b => b.id === loan.bookId);
        if (!book || book.availableCopies <= 0) return { success: false, message: 'Não há cópias disponíveis para aprovação.' };

        setBooks(prev => prev.map(b => b.id === book.id ? { ...b, availableCopies: Math.max(0, b.availableCopies - 1) } : b));
        setLoans(prev => prev.map(l => l.id === loanId ? { ...l, status: 'aprovado', approvalDate: new Date().toISOString() } : l));
        return { success: true, message: `Empréstimo de "${loan.bookTitle}" aprovado com sucesso!` };
      };

      const returnBook = (loanId, finePaid = false) => {
        const loan = loans.find(l => l.id === loanId);
        if (!loan) return { success: false, message: 'Empréstimo não encontrado.' };

        setBooks(prev => prev.map(b => b.id === loan.bookId ? { ...b, availableCopies: b.availableCopies + 1 } : b));
        setLoans(prev => prev.map(l => l.id === loanId ? { ...l, status: 'devolvido', returnDate: new Date().toISOString(), finePaid } : l));
        return { success: true, message: `Devolução de "${loan.bookTitle}" concluída!` };
      };

      const reserveBook = (bookId) => {
        const book = books.find(b => b.id === bookId);
        if (!book) return { success: false, message: 'Livro não encontrado.' };

        const newRes = {
          id: `res-${Date.now()}`,
          bookId: book.id,
          bookTitle: book.title,
          userId: currentUser.id,
          userName: currentUser.name,
          reservedAt: new Date().toISOString(),
          expectedAvailableDate: addDays(new Date(), settings.standardLoanDays),
          status: 'ativa',
          queuePosition: 1,
        };
        setReservations(prev => [newRes, ...prev]);
        return { success: true, message: `Reserva para "${book.title}" confirmada na fila de espera!` };
      };

      const executeSql = (q) => SqlEngine.execute(q, { books, users, loans, reservations, settings });
      const exportSqlDump = () => SqlEngine.generateDump(books, users, loans, reservations, settings);

      const resetData = () => {
        localStorage.clear();
        setUsers(SEED_USERS);
        setBooks(SEED_BOOKS);
        setLoans(SEED_LOANS);
        setReservations(SEED_RESERVATIONS);
        setNotifications(SEED_NOTIFICATIONS);
        setSettings(INITIAL_SETTINGS);
        setCurrentUser(SEED_USERS[1]);
      };

      return (
        <LibraryContext.Provider value={{
          currentUser, setCurrentUser, users, setUsers,
          books, setBooks, loans, reservations, notifications, settings, setSettings,
          requestLoan, approveLoan, returnBook, reserveBook,
          executeSql, exportSqlDump, resetData
        }}>
          {children}
        </LibraryContext.Provider>
      );
    };

      const { executeSql, exportSqlDump } = useLibrary();
      const [sql, setSql] = useState('SELECT id, titulo, autor, genero, disponiveis FROM books WHERE disponiveis > 0;');
      const [result, setResult] = useState(() => executeSql('SELECT id, titulo, autor, genero, disponiveis FROM books WHERE disponiveis > 0;'));

      const handleRun = (q) => {
        const queryToRun = q || sql;
        setResult(executeSql(queryToRun));
      };

      const handleDownloadSql = () => {
        const dump = exportSqlDump();
        const blob = new Blob([dump], { type: 'application/sql' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'bibliosaber_mysql_dump.sql';
        a.click();
      };

      return (
        <div className="space-y-6">
          <div className="bg-[#1C1612] text-white p-6 rounded-2xl border border-[#3E2B1E] flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
              <span className="text-xs font-mono text-emerald-400 block font-bold">● MySQL 8.0 Engine: Conectado</span>
              <h2 className="text-2xl font-serif font-bold mt-1">Console & Terminal Interativo MySQL</h2>
              <p className="text-xs text-stone-300 mt-0.5">Execute queries SQL reais em tempo real ou baixe o dump completo das tabelas.</p>
            </div>
            <button 
              onClick={handleDownloadSql}
              className="px-4 py-2 bg-[#8C531B] hover:bg-[#724114] text-white rounded-lg text-xs font-bold flex items-center gap-2 shadow-md"
            >
              <DownloadIcon className="w-4 h-4" />
              <span>Baixar Dump .sql</span>
            </button>
          </div>

          {/* Atalhos Rápidos */}
          <div className="flex flex-wrap gap-2 text-xs">
            <button onClick={() => { const q = 'SELECT id, titulo, autor, genero, disponiveis FROM books WHERE disponiveis > 0;'; setSql(q); handleRun(q); }} className="px-3 py-1.5 rounded-md bg-stone-200 hover:bg-stone-300 font-mono text-stone-800">
              🟢 Livros Disponíveis
            </button>
            <button onClick={() => { const q = 'SELECT id, titulo, autor, disponiveis FROM books WHERE disponiveis = 0;'; setSql(q); handleRun(q); }} className="px-3 py-1.5 rounded-md bg-stone-200 hover:bg-stone-300 font-mono text-stone-800">
              🔴 Livros Indisponíveis
            </button>
            <button onClick={() => { const q = "SELECT id, nome, email, matricula FROM users WHERE papel = 'aluno';"; setSql(q); handleRun(q); }} className="px-3 py-1.5 rounded-md bg-stone-200 hover:bg-stone-300 font-mono text-stone-800">
              🎓 Listar Alunos
            </button>
            <button onClick={() => { const q = 'SHOW TABLES;'; setSql(q); handleRun(q); }} className="px-3 py-1.5 rounded-md bg-stone-200 hover:bg-stone-300 font-mono text-stone-800">
              SHOW TABLES;
            </button>
          </div>

          {/* Editor SQL */}
          <div className="bg-[#1C1612] rounded-xl border border-[#3E2B1E] p-4 text-xs font-mono space-y-3">
            <textarea 
              value={sql} 
              onChange={e => setSql(e.target.value)}
              rows={3} 
              className="w-full bg-transparent text-emerald-400 focus:outline-hidden resize-none leading-relaxed"
            />
            <div className="flex justify-between items-center border-t border-white/10 pt-3">
              <span className="text-[11px] text-stone-400 font-sans">Sintaxe MySQL 8.0 pronta para execução</span>
              <button 
                onClick={() => handleRun()}
                className="px-4 py-1.5 bg-[#8C531B] text-white rounded-md font-bold text-xs flex items-center gap-1.5"
              >
                <PlayIcon className="w-3.5 h-3.5" />
                <span>Executar SQL</span>
              </button>
            </div>
          </div>

          {/* Tabela de Resultados */}
          {result && (
            <div className="bg-white rounded-xl border border-[#E6DFC4] p-5 shadow-xs space-y-3">
              <div className="flex justify-between items-center text-xs font-mono">
                <span className="font-bold text-stone-800">{result.rowCount} linha(s) encontrada(s)</span>
                <span className="text-emerald-700 font-bold">{result.latency} ms</span>
              </div>
              <div className="overflow-x-auto rounded-lg border border-stone-200">
                <table className="w-full text-left text-xs font-mono">
                  <thead className="bg-[#FAF8F5] border-b border-stone-200 font-bold text-stone-700">
                    <tr>
                      {result.columns.map(c => <th key={c} className="p-2.5 border-r border-stone-200 last:border-r-0">{c}</th>)}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-stone-100">
                    {result.rows.map((row, i) => (
                      <tr key={i} className="hover:bg-stone-50">
                        {result.columns.map(c => (
                          <td key={c} className="p-2.5 border-r border-stone-100 last:border-r-0 whitespace-nowrap">
                            {String(row[c] ?? 'NULL')}
                          </td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    };

    // Modal de Detalhes do Livro
    const BookModal = ({ book, onClose }) => {
      const { requestLoan, reserveBook } = useLibrary();
      const [msg, setMsg] = useState(null);

      if (!book) return null;
      const isAvailable = book.availableCopies > 0;

      const handleLoan = () => {
        const res = requestLoan(book.id);
        setMsg(res.message);
      };

      const handleReserve = () => {
        const res = reserveBook(book.id);
        setMsg(res.message);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-xs">
          <div className="bg-[#FAF8F5] rounded-2xl max-w-xl w-full p-6 border border-[#E6DFC4] shadow-2xl space-y-4">
            <div className="flex justify-between items-start border-b border-[#E6DFC4] pb-3">
              <div>
                <span className="text-[10px] font-mono text-[#8C531B] uppercase tracking-wider font-bold">{book.genre}</span>
                <h2 className="text-xl font-serif font-bold text-[#1E1612]">{book.title}</h2>
                <p className="text-xs text-stone-600">{book.author} · {book.publishedYear} · {book.pages} páginas</p>
              </div>
              <button onClick={onClose} className="p-1 rounded-md text-stone-400 hover:text-stone-700">
                <XCircleIcon className="w-5 h-5" />
              </button>
            </div>

            <div className="flex gap-4">
              <div className="w-32 h-44 rounded-lg overflow-hidden shrink-0 book-spine-effect">
                <img src={book.coverUrl} alt={book.title} className="w-full h-full object-cover" />
              </div>
              <div className="space-y-2 text-xs leading-relaxed text-stone-700">
                <p className="italic font-serif">{book.synopsis}</p>
                <div className="p-2.5 rounded-lg bg-stone-100 font-mono text-[11px] space-y-1">
                  <p><strong>ISBN:</strong> {book.isbn}</p>
                  <p><strong>Localização:</strong> {book.location}</p>
                  <p><strong>Disponibilidade:</strong> <span className={isAvailable ? 'text-emerald-700 font-bold' : 'text-rose-700 font-bold'}>{isAvailable ? `${book.availableCopies} exemplar(es) livre(s)` : 'Indisponível no momento'}</span></p>
                </div>
              </div>
            </div>

            {msg && (
              <div className="p-3 bg-emerald-100 text-emerald-900 rounded-lg text-xs font-semibold">
                {msg}
              </div>
            )}

            <div className="flex justify-end gap-2 pt-2 border-t border-stone-200">
              <button onClick={onClose} className="px-4 py-2 border rounded-lg text-xs font-semibold text-stone-600">Fechar</button>
              {isAvailable ? (
                <button onClick={handleLoan} className="px-4 py-2 bg-[#8C531B] text-white rounded-lg text-xs font-bold hover:bg-[#724114]">
                  Solicitar Empréstimo
                </button>
              ) : (
                <button onClick={handleReserve} className="px-4 py-2 bg-[#2C1D11] text-white rounded-lg text-xs font-bold hover:bg-[#3D2918]">
                  Entrar na Fila de Reserva
                </button>
              )}
            </div>
          </div>
        </div>
      );
    };

    // ====================================================================
    // 6. COMPONENTE RAIZ DA APLICAÇÃO (APP)
    // ====================================================================
    function App() {
      const { currentUser, setCurrentUser, users } = useLibrary();
      const [activeTab, setActiveTab] = useState('aluno');
      const [selectedBook, setSelectedBook] = useState(null);

      // Alternar rápido entre Aluno e Bibliotecária
      const toggleRole = () => {
        if (currentUser.role === 'aluno') {
          const lib = users.find(u => u.role === 'bibliotecaria');
          if (lib) {
            setCurrentUser(lib);
            setActiveTab('bibliotecaria');
          }
        } else {
          const st = users.find(u => u.role === 'aluno');
          if (st) {
            setCurrentUser(st);
            setActiveTab('aluno');
          }
        }
      };

      return (
        <div className="min-h-screen flex flex-col font-sans">
          {/* Barra Superior de Alternância e Identificação */}
          <header className="bg-[#1C1612] text-stone-300 text-xs py-2 px-4 border-b border-[#3E2B1E]">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-emerald-400" />
                <span>
                  Perfil Conectado:{' '}
                  <strong className="text-white font-serif">{currentUser.name}</strong> ({currentUser.role === 'bibliotecaria' ? 'Bibliotecária' : 'Aluno'})
                </span>
              </div>
              <div className="flex items-center gap-3">
                <button
                  onClick={toggleRole}
                  className="px-2.5 py-1 bg-white/10 hover:bg-white/15 text-[#C89B65] rounded text-[11px] font-bold flex items-center gap-1.5 transition-colors border border-white/10"
                >
                  <ArrowRightLeftIcon className="w-3 h-3" />
                  <span>Alternar para {currentUser.role === 'aluno' ? 'Bibliotecária' : 'Aluno'}</span>
                </button>
              </div>
            </div>
          </header>

          {/* Navbar Principal */}
          <nav className="bg-[#FAF8F5] border-b border-[#E6DFC4] px-4 py-3 sticky top-0 z-40 shadow-xs">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab(currentUser.role)}>
                <div className="w-9 h-9 rounded-lg bg-[#2C1D11] border border-[#B47836]/30 flex items-center justify-center text-[#E8D7C3] font-serif font-black text-xl italic shadow-xs">
                  B
                </div>
                <span className="font-serif font-bold text-xl tracking-tight text-[#1E1612]">
                  Biblio<span className="text-[#8C531B] italic font-normal">Saber</span>
                </span>
              </div>

              <div className="flex items-center gap-2 text-xs font-semibold">
                <button
                  onClick={() => setActiveTab('aluno')}
                  className={`px-3 py-1.5 rounded-lg transition-colors ${activeTab === 'aluno' ? 'bg-[#2C1D11] text-white font-bold' : 'text-stone-700 hover:bg-stone-200'}`}
                >
                  Portal do Aluno
                </button>
                <button
                  onClick={() => setActiveTab('bibliotecaria')}
                  className={`px-3 py-1.5 rounded-lg transition-colors ${activeTab === 'bibliotecaria' ? 'bg-[#2C1D11] text-white font-bold' : 'text-stone-700 hover:bg-stone-200'}`}
                >
                  Painel Bibliotecária
                </button>
                <button
                  onClick={() => setActiveTab('mysql')}
                  className={`px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors ${activeTab === 'mysql' ? 'bg-[#8C531B] text-white font-bold' : 'text-stone-700 hover:bg-stone-200'}`}
                >
                  <DatabaseIcon className="w-3.5 h-3.5" />
                  <span>Console MySQL</span>
                </button>
              </div>
            </div>
          </nav>

          {/* Conteúdo Principal */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            {activeTab === 'aluno' && <StudentView onSelectBook={setSelectedBook} />}
            {activeTab === 'bibliotecaria' && <LibrarianView onSelectBook={setSelectedBook} />}
            {activeTab === 'mysql' && <MySqlView />}
          </main>

          {/* Modal de Detalhes */}
          <BookModal book={selectedBook} onClose={() => setSelectedBook(null)} />

          {/* Rodapé Editorial */}
          <footer className="bg-[#1C1612] text-[#D4C5B3] border-t border-[#3E2B1E] py-8 text-xs text-center">
            <p className="font-serif font-bold text-white text-sm">BiblioSaber · Sistema Autônomo de Gestão de Biblioteca</p>
            <p className="text-stone-400 mt-1">Executável 100% autônomo em qualquer navegador sem necessidade de servidor Node.js ou bundler.</p>
          </footer>
        </div>
      );
    }

    // Renderiza no DOM
    ReactDOM.createRoot(document.getElementById('root')).render(
      <LibraryProvider>
        <App />
      </LibraryProvider>
    );
  </script>
</body>
</html>
