              };

            if (upperSql.startsWith('INSERT INTO')) {
              if (upperSql.includes('BOOKS')) {
                const titleMatch = cleanSql.match(/['"](.*?)['"]/g);
                const title = titleMatch && titleMatch[0] ? titleMatch[0].replace(/['"]/g, '') : 'Nova Obra Inserida via SQL';
                const author = titleMatch && titleMatch[1] ? titleMatch[1].replace(/['"]/g, '') : 'Autor Cadastrado via SQL';
                const genreCandidate = titleMatch && titleMatch[2] ? titleMatch[2].replace(/['"]/g, '') : 'Literatura Brasileira';
                const newBook = {
                  id: `book-sql-${Date.now()}`, title, author, genre: genreCandidate,
                  isbn: `978-85-SQL-${Math.floor(1000 + Math.random() * 9000)}`, publishedYear: 2024,
                  publisher: 'Editora BiblioSaber', totalCopies: 3, availableCopies: 3,
                  location: 'Estante D-SQL, Prateleira 1',
                  coverUrl: 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=800',
                  synopsis: 'Exemplar registrado diretamente via console relacional MySQL da biblioteca BiblioSaber.',
                  pages: 250, createdAt: new Date().toISOString(),
                };
                const executionTimeMs = Number((performance.now() - startTime).toFixed(2));
                return {
                  result: {
                    columns: ['id', 'title', 'author', 'genre', 'total_copies', 'available_copies'],
                    rows: [{ id: newBook.id, title: newBook.title, author: newBook.author, genre: newBook.genre, total_copies: 3, available_copies: 3 }],
                    rowCount: 1, affectedRows: 1, executionTimeMs, queryType: 'INSERT',
                    message: `1 registro inserido com sucesso na tabela 'books' (ID: ${newBook.id}).`,
                  },
                  updatedState: { books: [newBook, ...tables.books] },
                };
              }
              const executionTimeMs = Number((performance.now() - startTime).toFixed(2));
              return {
                result: {
                  columns: ['Query_Result', 'Affected_Rows'],
                  rows: [{ Query_Result: 'Comando INSERT executado com integridade relacional validada.', Affected_Rows: 1 }],
                  rowCount: 1, affectedRows: 1, executionTimeMs, queryType: 'INSERT',
                  message: 'INSERT INTO processado e sincronizado no banco de dados.',
                },
              };
            }

            if (upperSql.startsWith('UPDATE')) {
              if (upperSql.includes('SYSTEM_SETTINGS')) {
                const fineMatch = upperSql.match(/DAILY_FINE_AMOUNT\s*=\s*([0-9.]+)/);
                const loanDaysMatch = upperSql.match(/STANDARD_LOAN_DAYS\s*=\s*([0-9]+)/);
                const newSettings = { ...tables.settings };
                if (fineMatch) newSettings.dailyFineAmount = parseFloat(fineMatch[1]);
                if (loanDaysMatch) newSettings.standardLoanDays = parseInt(loanDaysMatch[1], 10);
                const executionTimeMs = Number((performance.now() - startTime).toFixed(2));
                return {
                  result: {
                    columns: ['daily_fine_amount', 'standard_loan_days', 'institution_name'],
                    rows: [{ daily_fine_amount: `R$ ${newSettings.dailyFineAmount.toFixed(2)}`, standard_loan_days: newSettings.standardLoanDays, institution_name: newSettings.institutionName }],
                    rowCount: 1, affectedRows: 1, executionTimeMs, queryType: 'UPDATE',
                    message: 'Tabela system_settings atualizada via comando SQL.',
                  },
                  updatedState: { settings: newSettings },
                };
              }
              const executionTimeMs = Number((performance.now() - startTime).toFixed(2));
              return {
                result: {
                  columns: ['Status', 'Affected_Rows'],
                  rows: [{ Status: 'Tabela atualizada com sucesso!', Affected_Rows: 1 }],
                  rowCount: 1, affectedRows: 1, executionTimeMs, queryType: 'UPDATE',
                  message: 'Linhas correspondentes foram atualizadas.',
                },
              };
            }

            if (upperSql.startsWith('DELETE')) {
              const executionTimeMs = Number((performance.now() - startTime).toFixed(2));
              return {
                result: {
                  columns: ['Status', 'Affected_Rows'],
                  rows: [{ Status: 'Comando DELETE processado respeitando ON DELETE CASCADE.', Affected_Rows: 1 }],
                  rowCount: 1, affectedRows: 1, executionTimeMs, queryType: 'DELETE',
                  message: 'Registro removido com sucesso.',
                },
              };
            }

            const executionTimeMs = Number((performance.now() - startTime).toFixed(2));
            return {
              result: {
                columns: ['Comando', 'Resultado', 'Engine'],
                rows: [{ Comando: cleanSql.slice(0, 40) + '...', Resultado: 'Comando DDL/DCL reconhecido pela sintaxe MySQL 8.0.', Engine: 'InnoDB' }],
                rowCount: 1, executionTimeMs, queryType: 'OTHER',
                message: 'Instrução SQL reconhecida com sucesso.',
              },
            };
          } catch (err) {
            return {
              result: {
                columns: ['Erro_MySQL'], rows: [], rowCount: 0,
                executionTimeMs: Number((performance.now() - startTime).toFixed(2)),
                error: err?.message || 'Erro na sintaxe SQL.',
              },
            };
          }
        }
      }

      // ====================================================================
      // 4. CONTEXTO GLOBAL DA BIBLIOTECA (LOCALSTORAGE + REGRAS)
      // ====================================================================
      const STORAGE_KEY = 'bibliosaber_db_v1';
      const LibraryContext = createContext(undefined);

      const LibraryProvider = ({ children }) => {
        const [users, setUsers] = useState(() => {
          const saved = localStorage.getItem(`${STORAGE_KEY}_users`);
          return saved ? JSON.parse(saved) : SEED_USERS;
        });

        const [currentUser, setCurrentUser] = useState(() => {
          const saved = localStorage.getItem(`${STORAGE_KEY}_current_user`);
          if (saved) {
            try { return JSON.parse(saved); } catch { return SEED_USERS[1]; }
          }
          return SEED_USERS[1];
        });

        const [books, setBooks] = useState(() => {
          const saved = localStorage.getItem(`${STORAGE_KEY}_books`);
          return saved ? JSON.parse(saved) : SEED_BOOKS;
        });

        const [loans, setLoans] = useState(() => {
          const saved = localStorage.getItem(`${STORAGE_KEY}_loans`);
          return saved ? JSON.parse(saved) : SEED_LOANS;
        });

        const [reservations, setReservations] = useState(() => {
          const saved = localStorage.getItem(`${STORAGE_KEY}_reservations`);
          return saved ? JSON.parse(saved) : SEED_RESERVATIONS;
        });

        const [notifications, setNotifications] = useState(() => {
          const saved = localStorage.getItem(`${STORAGE_KEY}_notifications`);
          return saved ? JSON.parse(saved) : SEED_NOTIFICATIONS;
        });

        const [settings, setSettings] = useState(() => {
          const saved = localStorage.getItem(`${STORAGE_KEY}_settings`);
          return saved ? JSON.parse(saved) : INITIAL_SETTINGS;
        });

        useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_users`, JSON.stringify(users)); }, [users]);
        useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_current_user`, JSON.stringify(currentUser)); }, [currentUser]);
        useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_books`, JSON.stringify(books)); }, [books]);
        useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_loans`, JSON.stringify(loans)); }, [loans]);
        useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_reservations`, JSON.stringify(reservations)); }, [reservations]);
        useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_notifications`, JSON.stringify(notifications)); }, [notifications]);
        useEffect(() => { localStorage.setItem(`${STORAGE_KEY}_settings`, JSON.stringify(settings)); }, [settings]);

        useEffect(() => {
          const now = new Date();
          let hasFineChanges = false;
          const newNotifications = [];

          const updatedLoans = loans.map((loan) => {
            if (loan.status !== 'aprovado') return loan;
            const due = new Date(loan.dueDate);
            const diffDays = Math.floor((now.getTime() - due.getTime()) / (1000 * 60 * 60 * 24));

            if (diffDays > settings.gracePeriodDays) {
              const calculatedFine = Number(((diffDays - settings.gracePeriodDays) * settings.dailyFineAmount).toFixed(2));
              if (loan.fineAmount !== calculatedFine && !loan.finePaid) {
                hasFineChanges = true;
                const existingNotif = notifications.find(n => n.relatedLoanId === loan.id && n.type === 'danger');
                if (!existingNotif) {
                  newNotifications.push({
                    id: `notif-overdue-${loan.id}-${Date.now()}`,
                    userId: loan.userId,
                    title: `Empréstimo em Atraso (${diffDays} dias)`,
                    message: `O livro "${loan.bookTitle}" está atrasado. Multa atual: R$ ${calculatedFine.toFixed(2)}. Regularize sua situação com a biblioteca.`,
                    type: 'danger',
                    createdAt: now.toISOString(),
                    read: false,
                    relatedBookId: loan.bookId,
                    relatedLoanId: loan.id,
                  });
                }
                return { ...loan, fineAmount: calculatedFine };
              }
            } else if (diffDays <= 0 && diffDays >= -2) {
              const daysLeft = Math.abs(diffDays);
              const existingWarning = notifications.find(n => n.relatedLoanId === loan.id && n.type === 'warning');
              if (!existingWarning) {
                newNotifications.push({
                  id: `notif-warning-${loan.id}-${Date.now()}`,
                  userId: loan.userId,
                  title: `Prazo de Devolução Próximo (${daysLeft === 0 ? 'Hoje' : `${daysLeft} dia(s)`})`,
                  message: `O livro "${loan.bookTitle}" vence ${daysLeft === 0 ? 'hoje' : `em ${daysLeft} dia(s)`}. Devolva ou solicite renovação para evitar multas de R$ ${settings.dailyFineAmount.toFixed(2)}/dia.`,
                  type: 'warning',
                  createdAt: now.toISOString(),
                  read: false,
                  relatedBookId: loan.bookId,
                  relatedLoanId: loan.id,
                });
              }
            }
            return loan;
          });

          if (hasFineChanges) setLoans(updatedLoans);
          if (newNotifications.length > 0) setNotifications(prev => [...newNotifications, ...prev]);
        }, [settings.dailyFineAmount, settings.gracePeriodDays]);

        const getExpectedReturnDate = (bookId) => {
          const book = books.find(b => b.id === bookId);
          if (!book || book.availableCopies > 0) return null;
          const activeLoans = loans
            .filter(l => l.bookId === bookId && l.status === 'aprovado')
            .sort((a, b) => new Date(a.dueDate).getTime() - new Date(b.dueDate).getTime());
          return activeLoans.length > 0 ? activeLoans[0].dueDate : null;
        };

        const registerStudent = (data) => {
          const existing = users.find(u =>
            u.email.toLowerCase() === data.email.toLowerCase() ||
            u.registrationNumber.toLowerCase() === data.registrationNumber.toLowerCase()
          );
          if (existing) return { success: false, message: 'Já existe um cadastro com este E-mail ou Matrícula!' };
          const newUser = {
            ...data,
            id: `user-student-${Date.now()}`,
            role: 'aluno',
            isBlocked: false,
            createdAt: new Date().toISOString(),
            avatarUrl: data.avatarUrl || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80',
          };
          setUsers(prev => [...prev, newUser]);
          setCurrentUser(newUser);
          setNotifications(prev => [{
            id: `notif-welcome-${newUser.id}`,
            userId: newUser.id,
            title: 'Bem-vindo ao BiblioSaber!',
            message: 'Seu cadastro de aluno foi realizado com sucesso. Explore o acervo e aproveite para reservar e emprestar livros.',
            type: 'success',
            createdAt: new Date().toISOString(),
            read: false,
          }, ...prev]);
          return { success: true, message: 'Cadastro de aluno criado com sucesso!', user: newUser };
        };

        const registerLibrarian = (data, code) => {
          if (code.trim() !== settings.librarianAccessCode.trim()) {
            return { success: false, message: 'Código de autorização institucional incorreto! Solicite o código da coordenação.' };
          }
          const existing = users.find(u => u.email.toLowerCase() === data.email.toLowerCase());
          if (existing) return { success: false, message: 'Já existe um usuário com este e-mail!' };
          const newLib = {
            ...data,
            id: `user-lib-${Date.now()}`,
            role: 'bibliotecaria',
            isBlocked: false,
            createdAt: new Date().toISOString(),
            avatarUrl: data.avatarUrl || 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=150&auto=format&fit=crop&q=80',
          };
          setUsers(prev => [...prev, newLib]);
          setCurrentUser(newLib);
          return { success: true, message: 'Perfil de Bibliotecária cadastrado com sucesso!', user: newLib };
        };

        const loginUser = (emailOrReg) => {
          const found = users.find(u =>
            u.email.toLowerCase() === emailOrReg.trim().toLowerCase() ||
            u.registrationNumber.toLowerCase() === emailOrReg.trim().toLowerCase()
          );
          if (!found) return { success: false, message: 'Usuário não encontrado. Verifique seu e-mail ou matrícula.' };
          if (found.isBlocked) return { success: false, message: 'Acesso bloqueado temporariamente por pendências/multas em atraso na biblioteca. Contate a bibliotecária.' };
          setCurrentUser(found);
          return { success: true, message: `Bem-vindo de volta, ${found.name}!`, user: found };
        };

        const toggleBlockUser = (userId) => {
          setUsers(prev => prev.map(u => (u.id === userId ? { ...u, isBlocked: !u.isBlocked } : u)));
        };

        const addBook = (bookData) => {
          const newBook = {
            ...bookData,
            id: `book-${Date.now()}`,
            availableCopies: bookData.totalCopies,
            createdAt: new Date().toISOString(),
            coverUrl: bookData.coverUrl || 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=600&auto=format&fit=crop&q=80',
          };
          setBooks(prev => [newBook, ...prev]);
          setNotifications(prev => [{
            id: `notif-newbook-${Date.now()}`,
            title: 'Novo Livro no Acervo!',
            message: `O livro "${newBook.title}" de ${newBook.author} foi adicionado à biblioteca com ${newBook.totalCopies} exemplares.`,
            type: 'info',
            createdAt: new Date().toISOString(),
            read: false,
            relatedBookId: newBook.id,
          }, ...prev]);
        };

        const updateBook = (id, bookData) => {
          setBooks(prev => prev.map(b => {
            if (b.id !== id) return b;
            const updated = { ...b, ...bookData };
            if (bookData.totalCopies !== undefined) {
              const borrowedCount = b.totalCopies - b.availableCopies;
              updated.availableCopies = Math.max(0, bookData.totalCopies - borrowedCount);
            }
            return updated;
          }));
        };

        const deleteBook = (id) => {
          const activeLoan = loans.find(l => l.bookId === id && (l.status === 'aprovado' || l.status === 'pendente'));
          if (activeLoan) return { success: false, message: 'Não é possível excluir este livro pois existem exemplares emprestados ou com solicitação pendente!' };
          setBooks(prev => prev.filter(b => b.id !== id));
          return { success: true, message: 'Livro removido do catálogo com sucesso.' };
        };

        const requestLoan = (bookId, notes) => {
          if (!currentUser) return { success: false, message: 'Faça login para solicitar um empréstimo.' };
          if (currentUser.role !== 'aluno') return { success: false, message: 'Apenas alunos podem solicitar empréstimos.' };
          if (currentUser.isBlocked) return { success: false, message: 'Seu cadastro está bloqueado devido a pendências de multas ou atrasos.' };
          const book = books.find(b => b.id === bookId);
          if (!book) return { success: false, message: 'Livro não encontrado.' };
          if (book.availableCopies <= 0) return { success: false, message: 'Todos os exemplares deste livro estão emprestados. Você pode fazer uma reserva online!' };

          const activeStudentLoans = loans.filter(l => l.userId === currentUser.id && (l.status === 'aprovado' || l.status === 'pendente'));
          if (activeStudentLoans.length >= settings.maxBooksPerStudent) {
            return { success: false, message: `Você já atingiu o limite máximo de ${settings.maxBooksPerStudent} livros emprestados simultaneamente.` };
          }
          if (activeStudentLoans.some(l => l.bookId === bookId)) {
            return { success: false, message: 'Você já possui uma solicitação ou empréstimo ativo deste mesmo livro.' };
          }

          const newLoan = {
            id: `loan-${Date.now()}`,
            bookId: book.id,
            bookTitle: book.title,
            bookCover: book.coverUrl,
            userId: currentUser.id,
            userName: currentUser.name,
            userEmail: currentUser.email,
            userRegistration: currentUser.registrationNumber,
            requestDate: new Date().toISOString(),
            dueDate: addDays(new Date(), settings.standardLoanDays),
            status: 'pendente',
            renewalsCount: 0,
            fineAmount: 0,
            finePaid: false,
            notes: notes || 'Solicitação online via portal do aluno',
          };
          setLoans(prev => [newLoan, ...prev]);
          setNotifications(prev => [{
            id: `notif-req-${Date.now()}`,
            title: 'Nova Solicitação de Empréstimo',
            message: `${currentUser.name} (${currentUser.registrationNumber}) solicitou o livro "${book.title}".`,
            type: 'info',
            createdAt: new Date().toISOString(),
            read: false,
            relatedBookId: book.id,
            relatedLoanId: newLoan.id,
          }, ...prev]);

          return { success: true, message: `Solicitação do livro "${book.title}" enviada! Aguarde a aprovação da bibliotecária.` };
        };

        const directIssueLoan = (bookId, studentId) => {
          const student = users.find(u => u.id === studentId);
          if (!student) return { success: false, message: 'Aluno não encontrado.' };
          const book = books.find(b => b.id === bookId);
          if (!book) return { success: false, message: 'Livro não encontrado.' };
          if (book.availableCopies <= 0) return { success: false, message: 'Não há exemplares disponíveis.' };

          const activeStudentLoans = loans.filter(l => l.userId === student.id && (l.status === 'aprovado' || l.status === 'pendente'));
          if (activeStudentLoans.length >= settings.maxBooksPerStudent) {
            return { success: false, message: `Aluno já atingiu o limite de ${settings.maxBooksPerStudent} livros.` };
          }

          const newLoan = {
            id: `loan-${Date.now()}`,
            bookId: book.id,
            bookTitle: book.title,
            bookCover: book.coverUrl,
            userId: student.id,
            userName: student.name,
            userEmail: student.email,
            userRegistration: student.registrationNumber,
            requestDate: new Date().toISOString(),
            approvalDate: new Date().toISOString(),
            dueDate: addDays(new Date(), settings.standardLoanDays),
            status: 'aprovado',
            renewalsCount: 0,
            fineAmount: 0,
            finePaid: false,
            notes: 'Empréstimo direto emitido no balcão pela bibliotecária.',
          };

          setLoans(prev => [newLoan, ...prev]);
          setBooks(prev => prev.map(b => (b.id === bookId ? { ...b, availableCopies: Math.max(0, b.availableCopies - 1) } : b)));
          setNotifications(prev => [{
            id: `notif-direct-${Date.now()}`,
            userId: student.id,
            title: 'Empréstimo Emitido no Balcão!',
            message: `O livro "${book.title}" foi retirado. Data prevista para devolução: ${new Date(newLoan.dueDate).toLocaleDateString('pt-BR')}.`,
            type: 'success',
            createdAt: new Date().toISOString(),
            read: false,
            relatedBookId: book.id,
            relatedLoanId: newLoan.id,
          }, ...prev]);
          return { success: true, message: `Empréstimo de "${book.title}" emitido com sucesso para ${student.name}!` };
        };

        const approveLoan = (loanId) => {
          const loan = loans.find(l => l.id === loanId);
          if (!loan) return { success: false, message: 'Empréstimo não encontrado.' };
          const book = books.find(b => b.id === loan.bookId);
          if (!book) return { success: false, message: 'Livro associado não encontrado.' };
          if (book.availableCopies <= 0) return { success: false, message: 'Sem exemplares disponíveis no momento para aprovar este empréstimo.' };

          const now = new Date();
          const dueDate = addDays(now, settings.standardLoanDays);
          setLoans(prev => prev.map(l => (l.id === loanId ? { ...l, status: 'aprovado', approvalDate: now.toISOString(), dueDate } : l)));
          setBooks(prev => prev.map(b => (b.id === book.id ? { ...b, availableCopies: Math.max(0, b.availableCopies - 1) } : b)));
          setNotifications(prev => [{
            id: `notif-appr-${Date.now()}`,
            userId: loan.userId,
            title: 'Empréstimo Aprovado!',
            message: `Sua solicitação do livro "${loan.bookTitle}" foi aprovada! Retire no balcão. Prazo: ${new Date(dueDate).toLocaleDateString('pt-BR')}.`,
            type: 'success',
            createdAt: now.toISOString(),
            read: false,
            relatedBookId: loan.bookId,
            relatedLoanId: loan.id,
          }, ...prev]);
          return { success: true, message: `Empréstimo de "${loan.bookTitle}" aprovado com sucesso!` };
        };

        const rejectLoan = (loanId, reason) => {
          const loan = loans.find(l => l.id === loanId);
          if (!loan) return { success: false, message: 'Empréstimo não encontrado.' };
          setLoans(prev => prev.map(l => (l.id === loanId ? { ...l, status: 'recusado', notes: reason || 'Recusado pela bibliotecária.' } : l)));
          setNotifications(prev => [{
            id: `notif-rej-${Date.now()}`,
            userId: loan.userId,
            title: 'Solicitação de Empréstimo Recusada',
            message: `Sua solicitação de "${loan.bookTitle}" não pôde ser atendida: ${reason || 'Contate a bibliotecária.'}`,
            type: 'danger',
            createdAt: new Date().toISOString(),
            read: false,
            relatedBookId: loan.bookId,
          }, ...prev]);
          return { success: true, message: 'Solicitação recusada.' };
        };

        const returnBook = (loanId, finePaid = true, notes) => {
          const loan = loans.find(l => l.id === loanId);
          if (!loan) return { success: false, message: 'Empréstimo não encontrado.' };
          if (loan.status === 'devolvido') return { success: false, message: 'Este livro já foi devolvido.' };

          const now = new Date();
          const due = new Date(loan.dueDate);
          const diffDays = Math.floor((now.getTime() - due.getTime()) / (1000 * 60 * 60 * 24));
          let finalFine = loan.fineAmount;
          if (diffDays > settings.gracePeriodDays && !loan.finePaid) {
            finalFine = Number(((diffDays - settings.gracePeriodDays) * settings.dailyFineAmount).toFixed(2));
          }

          setLoans(prev => prev.map(l => l.id === loanId ? {
            ...l, status: 'devolvido', returnDate: now.toISOString(),
            fineAmount: finalFine, finePaid: finePaid || finalFine === 0,
            notes: notes || l.notes || 'Devolução registrada no sistema.',
          } : l));

          setBooks(prev => prev.map(b => (b.id === loan.bookId ? { ...b, availableCopies: Math.min(b.totalCopies, b.availableCopies + 1) } : b)));

          const nextReservation = reservations.find(r => r.bookId === loan.bookId && r.status === 'ativa');
          if (nextReservation) {
            const pickupUntil = addDays(now, 2);
            setReservations(prev => prev.map(r => (r.id === nextReservation.id ? { ...r, status: 'disponivel_retirada', availableUntil: pickupUntil } : r)));
            setNotifications(prev => [{
              id: `notif-res-ready-${Date.now()}`,
              userId: nextReservation.userId,
              title: 'Livro Reservado Disponível para Retirada!',
              message: `O livro "${nextReservation.bookTitle}" foi devolvido e está reservado para você no balcão até ${new Date(pickupUntil).toLocaleDateString('pt-BR')}.`,
              type: 'success',
              createdAt: now.toISOString(),
              read: false,
              relatedBookId: nextReservation.bookId,
            }, ...prev]);
          }

          setNotifications(prev => [{
            id: `notif-ret-${Date.now()}`,
            userId: loan.userId,
            title: 'Devolução Confirmada',
            message: `O livro "${loan.bookTitle}" foi devolvido com sucesso. ${finalFine > 0 ? (finePaid ? 'Multa quitada no ato.' : `Multa pendente: R$ ${finalFine.toFixed(2)}.`) : 'Sem pendências.'}`,
            type: finalFine > 0 && !finePaid ? 'danger' : 'info',
            createdAt: now.toISOString(),
            read: false,
            relatedBookId: loan.bookId,
          }, ...prev]);

          return { success: true, message: `Devolução de "${loan.bookTitle}" registrada! ${finalFine > 0 ? `(Multa: R$ ${finalFine.toFixed(2)})` : ''}` };
        };

        const renewLoan = (loanId) => {
          const loan = loans.find(l => l.id === loanId);
          if (!loan) return { success: false, message: 'Empréstimo não encontrado.' };
          if (loan.status !== 'aprovado') return { success: false, message: 'Apenas empréstimos ativos podem ser renovados.' };
          if (loan.renewalsCount >= settings.maxRenewalsAllowed) {
            return { success: false, message: `Você já atingiu o limite de ${settings.maxRenewalsAllowed} renovações para este livro.` };
          }
          if (reservations.some(r => r.bookId === loan.bookId && r.status === 'ativa' && r.userId !== loan.userId)) {
            return { success: false, message: 'Não é possível renovar: existem outros alunos na fila de reserva deste livro!' };
          }
          const now = new Date();
          const due = new Date(loan.dueDate);
          if (now > due) return { success: false, message: 'Livro em atraso não pode ser renovado online. Compareça ao balcão da biblioteca.' };

          const newDueDate = addDays(due, settings.standardLoanDays);
          setLoans(prev => prev.map(l => (l.id === loanId ? { ...l, dueDate: newDueDate, renewalsCount: l.renewalsCount + 1 } : l)));
          setNotifications(prev => [{
            id: `notif-ren-${Date.now()}`,
            userId: loan.userId,
            title: 'Empréstimo Renovado!',
            message: `O prazo de "${loan.bookTitle}" foi estendido até ${new Date(newDueDate).toLocaleDateString('pt-BR')}.`,
            type: 'success',
            createdAt: now.toISOString(),
            read: false,
            relatedBookId: loan.bookId,
            relatedLoanId: loan.id,
          }, ...prev]);
          return { success: true, message: `Renovado com sucesso! Nova data de devolução: ${new Date(newDueDate).toLocaleDateString('pt-BR')}` };
        };

        const payFine = (loanId) => setLoans(prev => prev.map(l => (l.id === loanId ? { ...l, finePaid: true } : l)));

        const reserveBook = (bookId) => {
          if (!currentUser) return { success: false, message: 'Faça login para reservar um livro.' };
          if (currentUser.role !== 'aluno') return { success: false, message: 'Apenas alunos podem fazer reservas.' };
          if (currentUser.isBlocked) return { success: false, message: 'Cadastro bloqueado por pendências de multas.' };
          const book = books.find(b => b.id === bookId);
          if (!book) return { success: false, message: 'Livro não encontrado.' };

          if (reservations.some(r => r.bookId === bookId && r.userId === currentUser.id && (r.status === 'ativa' || r.status === 'disponivel_retirada'))) {
            return { success: false, message: 'Você já possui uma reserva ativa para este livro.' };
          }
          if (loans.some(l => l.bookId === bookId && l.userId === currentUser.id && (l.status === 'aprovado' || l.status === 'pendente'))) {
            return { success: false, message: 'Você já possui um empréstimo ou solicitação deste livro em andamento.' };
          }

          const existingQueue = reservations.filter(r => r.bookId === bookId && r.status === 'ativa');
          const queuePosition = existingQueue.length + 1;
          const expectedDate = getExpectedReturnDate(bookId) || addDays(new Date(), settings.standardLoanDays);

          const newReservation = {
            id: `res-${Date.now()}`,
            bookId: book.id,
            bookTitle: book.title,
            bookCover: book.coverUrl,
            userId: currentUser.id,
            userName: currentUser.name,
            userEmail: currentUser.email,
            userRegistration: currentUser.registrationNumber,
            reservedAt: new Date().toISOString(),
            expectedAvailableDate: expectedDate,
            status: 'ativa',
            queuePosition,
          };

          setReservations(prev => [...prev, newReservation]);
          setNotifications(prev => [{
            id: `notif-res-placed-${Date.now()}`,
            userId: currentUser.id,
            title: 'Reserva Confirmada!',
            message: `Sua reserva para "${book.title}" foi registrada (Posição ${queuePosition} na fila).`,
            type: 'info',
            createdAt: new Date().toISOString(),
            read: false,
            relatedBookId: book.id,
          }, ...prev]);

          return { success: true, message: `Reserva de "${book.title}" efetuada! Posição na fila: ${queuePosition}.` };
        };

        const cancelReservation = (reservationId) => {
          setReservations(prev => prev.map(r => (r.id === reservationId ? { ...r, status: 'cancelada' } : r)));
        };

        const markNotificationAsRead = (id) => {
          setNotifications(prev => prev.map(n => (n.id === id ? { ...n, read: true } : n)));
        };

        const clearNotifications = () => {
          if (!currentUser) return;
          setNotifications(prev => prev.map(n => (!n.userId || n.userId === currentUser.id ? { ...n, read: true } : n)));
        };

        const unreadCount = useMemo(() => {
          if (!currentUser) return 0;
          return notifications.filter(n => !n.read && (!n.userId || n.userId === currentUser.id)).length;
        }, [notifications, currentUser]);

        const updateSettings = (newSettings) => setSettings(prev => ({ ...prev, ...newSettings }));

        const resetToDefaultData = () => {
          setUsers(SEED_USERS);
          setCurrentUser(SEED_USERS[1]);
          setBooks(SEED_BOOKS);
          setLoans(SEED_LOANS);
          setReservations(SEED_RESERVATIONS);
          setNotifications(SEED_NOTIFICATIONS);
          setSettings(INITIAL_SETTINGS);
          localStorage.clear();
        };

        const exportDatabaseJson = () => JSON.stringify({
          version: '1.0', exportedAt: new Date().toISOString(),
          users, books, loans, reservations, notifications, settings,
        }, null, 2);

        const importDatabaseJson = (jsonStr) => {
          try {
            const data = JSON.parse(jsonStr);
            if (!data.books || !data.users || !data.loans) return { success: false, message: 'Arquivo JSON inválido para a base da biblioteca.' };
            setUsers(data.users || SEED_USERS);
            setBooks(data.books || SEED_BOOKS);
            setLoans(data.loans || SEED_LOANS);
            setReservations(data.reservations || []);
            setNotifications(data.notifications || []);
            setSettings(data.settings || INITIAL_SETTINGS);
            return { success: true, message: 'Base de dados importada com sucesso!' };
          } catch {
            return { success: false, message: 'Erro ao analisar arquivo JSON.' };
          }
        };

        const exportSqlDump = () => SqlDatabaseEngine.generateSqlDump(books, users, loans, reservations, settings);

        const executeSql = (query) => {
          const { result, updatedState } = SqlDatabaseEngine.executeQuery(query, { books, users, loans, reservations, settings });
          if (updatedState) {
            if (updatedState.books) setBooks(updatedState.books);
            if (updatedState.users) setUsers(updatedState.users);
            if (updatedState.loans) setLoans(updatedState.loans);
            if (updatedState.reservations) setReservations(updatedState.reservations);
            if (updatedState.settings) setSettings(updatedState.settings);
          }
          return result;
        };

        const getNeverBorrowedBooks = () => {
          const borrowedBookIds = new Set(loans.map(l => l.bookId));
          return books.filter(b => !borrowedBookIds.has(b.id));
        };

        const getMonthlyStats = () => {
          const now = new Date();
          const currentMonth = now.getMonth();
          const currentYear = now.getFullYear();

          const loansThisMonth = loans.filter(l => {
            const d = new Date(l.requestDate);
            return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
          });
          const activeLoans = loans.filter(l => l.status === 'aprovado');
          const overdueLoans = activeLoans.filter(l => now.getTime() > new Date(l.dueDate).getTime());
          const completedReturns = loans.filter(l => l.status === 'devolvido');

          let returnedOnTimeCount = 0;
          let returnedLateCount = 0;
          completedReturns.forEach(l => {
            if (!l.returnDate) return;
            if (new Date(l.returnDate) <= new Date(l.dueDate)) returnedOnTimeCount++;
            else returnedLateCount++;
          });

          const totalFinesCollected = loans.filter(l => l.finePaid && l.fineAmount > 0).reduce((s, l) => s + l.fineAmount, 0);
          const totalFinesPending = loans.filter(l => !l.finePaid && l.fineAmount > 0).reduce((s, l) => s + l.fineAmount, 0);

          const readerCounts = {};
          loans.forEach(l => { readerCounts[l.userId] = (readerCounts[l.userId] || 0) + 1; });
          const topReaders = Object.entries(readerCounts)
            .map(([userId, count]) => {
              const user = users.find(u => u.id === userId);
              return user ? { user, count } : null;
            })
            .filter(Boolean)
            .sort((a, b) => b.count - a.count)
            .slice(0, 5);

          const genreCounts = {};
          loans.forEach(l => {
            const book = books.find(b => b.id === l.bookId);
            if (book) genreCounts[book.genre] = (genreCounts[book.genre] || 0) + 1;
          });
          const genreDistribution = Object.entries(genreCounts)
            .map(([genre, count]) => ({ genre, count }))
            .sort((a, b) => b.count - a.count);

          return {
            totalLoansThisMonth: loansThisMonth.length,
            activeLoansCount: activeLoans.length,
            overdueLoansCount: overdueLoans.length,
            returnedOnTimeCount,
            returnedLateCount,
            totalFinesCollected,
            totalFinesPending,
            topReaders,
            genreDistribution,
          };
        };

        return (
          <LibraryContext.Provider value={{
            currentUser, users, books, loans, reservations, notifications, settings,
            setCurrentUser, registerStudent, registerLibrarian, loginUser, toggleBlockUser,
            addBook, updateBook, deleteBook, getExpectedReturnDate,
            requestLoan, approveLoan, rejectLoan, returnBook, renewLoan, payFine, directIssueLoan,
            reserveBook, cancelReservation, markNotificationAsRead, clearNotifications, unreadCount,
            updateSettings, resetToDefaultData, exportDatabaseJson, importDatabaseJson,
            exportSqlDump, executeSql, getNeverBorrowedBooks, getMonthlyStats,
          }}>
            {children}
          </LibraryContext.Provider>
        );
      };

      const useLibrary = () => {
        const ctx = useContext(LibraryContext);
        if (!ctx) throw new Error('useLibrary deve ser utilizado dentro de um LibraryProvider');
        return ctx;
      };

      // ====================================================================
      // 5. COMPONENTES BOOK3D & FEATURED CAROUSEL

              <div className="absolute right-0 top-1 bottom-1 w-1.5 z-10 bg-gradient-to-l from-[#FAF7F0] via-[#EAE1D2] to-[#D5C7B4] border-l border-black/15 shadow-inner" />
              <div className="absolute left-1 right-0 bottom-0 h-1 z-10 bg-gradient-to-t from-[#E2D4BF] to-[#F5EFE4] border-t border-black/10" />

              {!imageError && book.coverUrl ? (
                <img
                  src={book.coverUrl}

              ) : (

              {size !== 'sm' && (

      const FeaturedCarousel = ({ books, onSelectBook, getExpectedReturnDate }) => {
        const featuredBooks = books.slice(0, 5);
        const [currentIndex, setCurrentIndex] = useState(0);
        const [isPaused, setIsPaused] = useState(false);

        useEffect(() => {
          if (isPaused || featuredBooks.length <= 1) return;
          const interval = setInterval(() => {
            setCurrentIndex(prev => (prev + 1) % featuredBooks.length);
          }, 6000);
          return () => clearInterval(interval);
        }, [isPaused, featuredBooks.length]);

        if (featuredBooks.length === 0) return null;
        const safeIdx = currentIndex % featuredBooks.length;
        const currentBook = featuredBooks[safeIdx];
        const isAvailable = currentBook.availableCopies > 0;
        const returnDate = !isAvailable ? getExpectedReturnDate(currentBook.id) : null;

        const badges = [
          'Obra do Mês · Seleção da Curadoria',
          'Mais Solicitado do Acervo',
          'Clássico Universal Obrigatório',
          'Destaque de Ficção & Filosofia',
          'Tesouro do Acervo Raro',
        ];

        return (
          <div
            onMouseEnter={() => setIsPaused(true)}
            onMouseLeave={() => setIsPaused(false)}
            className="relative rounded-2xl bg-gradient-to-br from-[#380E14] via-[#4A121A] to-[#1F070A] border border-[#6B1E29]/60 shadow-2xl overflow-hidden text-white transition-all"
          >
            <div className="absolute top-1/2 right-1/4 -translate-y-1/2 w-96 h-96 bg-[#C99757]/15 rounded-full blur-3xl pointer-events-none" />
            <div className="absolute top-0 left-0 w-80 h-80 bg-[#681A24]/30 rounded-full blur-2xl pointer-events-none" />

            <div className="relative z-10 p-6 sm:p-10 lg:p-12">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">
                <div className="lg:col-span-7 space-y-4">
                  <div className="flex flex-wrap items-center gap-3">
                    <span className="px-3 py-1 rounded-full bg-[#C99757]/20 border border-[#C99757]/40 text-[#E5B869] text-xs font-mono font-bold flex items-center gap-1.5 shadow-xs">
                      <Sparkles className="w-3.5 h-3.5 text-[#E5B869]" />
                      <span>{badges[safeIdx % badges.length]}</span>
                    </span>

                  </div>

                    </h2>

                      por {currentBook.author} · {currentBook.publishedYear}
                    </p>
                  </div>

                  <p className="text-xs sm:text-sm text-stone-200 leading-relaxed max-w-xl line-clamp-3 sm:line-clamp-4 font-sans">
                    {currentBook.synopsis || 'Obra fundamental de nosso acervo físico com encadernação nobre disponível para pesquisa e empréstimo.'}
                  </p>

                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 pt-2 text-xs font-mono">
                    <div className="bg-white/5 border border-white/10 p-2.5 rounded-lg">
                      <span className="text-stone-300 text-[10px] block">Localização</span>
                      <strong className="text-white text-xs truncate block">{currentBook.location}</strong>
                    </div>
                    <div className="bg-white/5 border border-white/10 p-2.5 rounded-lg">
                      <span className="text-stone-300 text-[10px] block">Exemplares</span>
                      <strong className={isAvailable ? 'text-emerald-400 text-xs' : 'text-rose-300 text-xs'}>
                        {isAvailable ? `${currentBook.availableCopies} de ${currentBook.totalCopies} livres` : '0 disponíveis'}
                      </strong>
                    </div>
                    <div className="bg-white/5 border border-white/10 p-2.5 rounded-lg col-span-2 sm:col-span-1">
                      <span className="text-stone-300 text-[10px] block">Páginas / ISBN</span>
                      <strong className="text-white text-xs">{currentBook.pages} págs</strong>
                    </div>
                  </div>

                  <div className="pt-3 flex flex-wrap items-center gap-3">
                    <button
                      onClick={() => onSelectBook(currentBook)}
                      className="px-5 py-3 rounded-xl bg-[#C99757] hover:bg-[#DFB275] text-[#24080D] font-bold text-xs sm:text-sm shadow-lg transition-all flex items-center gap-2 group"
                    >
                      <span>{isAvailable ? 'Solicitar Empréstimo' : 'Entrar na Fila de Reserva'}</span>
                      <ArrowRight className="w-4 h-4 group-hover:translate-x-1 transition-transform" />
                    </button>
                    <button
                      onClick={() => onSelectBook(currentBook)}
                      className="px-4 py-3 rounded-xl bg-white/10 hover:bg-white/15 text-white font-semibold text-xs border border-white/15 transition-colors"
                    >
                      Ver Ficha Completa

                    {!isAvailable && returnDate && (
                      <div className="flex items-center gap-1.5 text-xs text-rose-300 font-mono">

                <div className="lg:col-span-5 flex flex-col items-center justify-center">

              <div className="mt-8 pt-5 border-t border-white/10 flex items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <span className="font-mono text-xs text-[#E5B869] font-bold">
                    0{safeIdx + 1} <span className="text-stone-400">/ 0{featuredBooks.length}</span>
                  </span>
                  <div className="hidden sm:flex items-center gap-1.5">
                    {featuredBooks.map((_, idx) => (
                      <button
                        key={idx}
                        onClick={() => setCurrentIndex(idx)}
                        className={`h-1.5 rounded-full transition-all ${idx === safeIdx ? 'w-6 bg-[#C99757]' : 'w-1.5 bg-white/20 hover:bg-white/40'}`}
                        aria-label={`Ir para obra ${idx + 1}`}
                      />
                    ))}
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setCurrentIndex(prev => (prev - 1 + featuredBooks.length) % featuredBooks.length)}
                    className="p-2 rounded-lg bg-white/10 hover:bg-white/20 text-white transition-colors border border-white/10"
                    title="Obra anterior"
                  >
                    <ChevronLeft className="w-4 h-4" />
                  </button>

      // Helper para imagem segura com fallback elegante

      // ====================================================================

                    {showNotifDropdown && (

      // ====================================================================
      // 7. PORTAL DO ALUNO (ACERVO, CARROSSEL 3D, EMPRÉSTIMOS E RESERVAS)
      // ====================================================================
      const StudentPortal = ({ onSelectBook, onOpenAuth, activeTab, setActiveTab }) => {
        const {
          currentUser, books, loans, reservations,
          getExpectedReturnDate, renewLoan, cancelReservation, settings,
        } = useLibrary();

        const [searchTerm, setSearchTerm] = useState('');
        const [selectedGenre, setSelectedGenre] = useState('todos');
        const [availabilityFilter, setAvailabilityFilter] = useState('todos');
        const [sortBy, setSortBy] = useState('title');
        const [actionFeedback, setActionFeedback] = useState(null);

        const genres = [
          'Literatura Brasileira', 'Ficção Científica', 'Romance', 'Fantasia',
          'Tecnologia & Computação', 'História & Filosofia', 'Ciências & Biologia',
          'Autoajuda & Negócios', 'HQ & Mangá', 'Poesia & Teatro',
        ];

        const filteredBooks = useMemo(() => {
          return books
            .filter(book => {
              const term = searchTerm.toLowerCase().trim();
              const matchesSearch = !term ||
                book.title.toLowerCase().includes(term) ||
                book.author.toLowerCase().includes(term) ||
                book.genre.toLowerCase().includes(term) ||
                book.isbn.toLowerCase().includes(term);
              const matchesGenre = selectedGenre === 'todos' || book.genre === selectedGenre;
              const matchesAvailability =
                availabilityFilter === 'todos' ||
                (availabilityFilter === 'disponiveis' && book.availableCopies > 0) ||
                (availabilityFilter === 'indisponiveis' && book.availableCopies === 0);
              return matchesSearch && matchesGenre && matchesAvailability;
            })
            .sort((a, b) => {
              if (sortBy === 'title') return a.title.localeCompare(b.title);
              if (sortBy === 'author') return a.author.localeCompare(b.author);
              return b.publishedYear - a.publishedYear;
            });
        }, [books, searchTerm, selectedGenre, availabilityFilter, sortBy]);

        const userLoans = useMemo(() => (currentUser ? loans.filter(l => l.userId === currentUser.id) : []), [loans, currentUser]);
        const activeLoans = userLoans.filter(l => l.status === 'aprovado');
        const pendingLoans = userLoans.filter(l => l.status === 'pendente');
        const returnedLoans = userLoans.filter(l => l.status === 'devolvido');
        const userReservations = useMemo(() => (currentUser ? reservations.filter(r => r.userId === currentUser.id && r.status !== 'cancelada') : []), [reservations, currentUser]);

        const handleRenew = (loanId) => {
          const res = renewLoan(loanId);
          setActionFeedback({ id: loanId, message: res.message, isError: !res.success });
          setTimeout(() => setActionFeedback(null), 4000);
        };

        const getLoanStatusInfo = (loan) => {
          if (loan.status === 'pendente') {
            return { label: 'Aguardando Aprovação', textClass: 'text-amber-800', icon: <Clock className="w-4 h-4 text-amber-700" />, description: 'Solicitação em análise na circulação.' };
          }
          if (loan.status === 'devolvido') {
            return { label: 'Devolvido', textClass: 'text-stone-600', icon: <CheckCircle2 className="w-4 h-4 text-stone-500" />, description: loan.returnDate ? `Devolvido em ${new Date(loan.returnDate).toLocaleDateString('pt-BR')}` : 'Devolução registrada' };
          }
          const now = new Date();
          const due = new Date(loan.dueDate);
          const diffDays = Math.ceil((due.getTime() - now.getTime()) / (1000 * 60 * 60 * 24));
          if (diffDays < 0) {
            return { label: `Em atraso (${Math.abs(diffDays)} dias)`, textClass: 'text-rose-800 font-bold', icon: <AlertTriangle className="w-4 h-4 text-rose-700" />, description: `Prazo expirado em ${due.toLocaleDateString('pt-BR')}. Multa: R$ ${loan.fineAmount.toFixed(2)}` };
          }
          if (diffDays <= 2) {
            return { label: diffDays === 0 ? 'Vence hoje!' : `Vence em ${diffDays} dia(s)`, textClass: 'text-amber-800 font-semibold', icon: <AlertTriangle className="w-4 h-4 text-amber-700" />, description: `Vencimento próximo: devolver até ${due.toLocaleDateString('pt-BR')}` };
          }
          return { label: `Em dia (${diffDays} dias restantes)`, textClass: 'text-emerald-800 font-medium', icon: <CheckCircle2 className="w-4 h-4 text-emerald-700" />, description: `Devolver até ${due.toLocaleDateString('pt-BR')}` };
        };

        return (
          <div className="space-y-10 pb-20">
            <section className="relative overflow-hidden rounded-2xl bg-[#2D0B10] text-[#FDFBF7] p-8 sm:p-10 border border-[#4A121A] shadow-xl">
              <div className="absolute top-0 right-0 w-80 h-80 bg-[#C99757]/10 rounded-full blur-3xl pointer-events-none" />
              <div className="relative z-10 max-w-3xl space-y-3">
                <div className="text-xs uppercase tracking-widest text-[#E5B869] font-mono font-bold">
                  Catálogo & Acervo Literário · Ano Acadêmico 2026
                </div>
                <h1 className="text-3xl sm:text-5xl font-serif font-bold text-[#FDFBF7] leading-tight tracking-tight">
                  O silêncio fecundo da leitura e a nobreza do saber.
                </h1>
                <p className="text-stone-300 text-xs sm:text-sm leading-relaxed max-w-2xl font-sans">
                  Consulte a disponibilidade em tempo real das obras físicas, acompanhe as previsões exatas de retorno de volumes emprestados e reserve títulos disputados para retirada rápida.
                </p>
                {currentUser && (
                  <div className="pt-3 flex flex-wrap items-center gap-3 text-xs text-stone-300 border-t border-white/10">
                    <span>Aluno: <strong className="text-white font-serif">{currentUser.name}</strong></span>
                    <span aria-hidden="true">·</span>
                    <span className="font-mono">{currentUser.registrationNumber}</span>
                    <span aria-hidden="true">·</span>
                    <span>Empréstimos: <strong>{activeLoans.length} de {settings.maxBooksPerStudent}</strong></span>
                    {userLoans.some(l => l.fineAmount > 0 && !l.finePaid) && (
                      <>
                        <span aria-hidden="true">·</span>
                        <span className="text-rose-400 font-bold">Multa pendente ativa</span>
                      </>
                    )}
                  </div>
                )}
              </div>
            </section>

            <div className="flex border-b border-[#E6DFC4] gap-8 text-sm font-medium overflow-x-auto">
              <button
                onClick={() => setActiveTab('acervo')}
                className={`pb-3 transition-colors relative whitespace-nowrap ${activeTab === 'acervo' ? 'text-[#2D0B10] font-serif font-bold text-base after:absolute after:bottom-0 after:left-0 after:right-0 after:h-0.5 after:bg-[#681A24]' : 'text-stone-500 hover:text-stone-800'}`}
              >
                Explorar Acervo de Livros ({books.length})
              </button>
              <button
                onClick={() => setActiveTab('meus-emprestimos')}
                className={`pb-3 transition-colors relative whitespace-nowrap flex items-center gap-2 ${activeTab === 'meus-emprestimos' ? 'text-[#2D0B10] font-serif font-bold text-base after:absolute after:bottom-0 after:left-0 after:right-0 after:h-0.5 after:bg-[#681A24]' : 'text-stone-500 hover:text-stone-800'}`}
              >
                <span>Meus Empréstimos & Reservas</span>
                {currentUser && (activeLoans.length > 0 || pendingLoans.length > 0 || userReservations.length > 0) && (
                  <span className="font-mono text-xs px-1.5 py-0.2 bg-[#F7F2EA] text-[#681A24] rounded-sm font-bold border border-[#681A24]/20">
                    {activeLoans.length + pendingLoans.length + userReservations.length}
                  </span>
                )}
              </button>
            </div>

            {activeTab === 'acervo' && (
              <div className="space-y-8">
                <FeaturedCarousel books={books} onSelectBook={onSelectBook} getExpectedReturnDate={getExpectedReturnDate} />

                <div className="bg-[#FAF8F5] p-6 rounded-xl border border-[#E6DFC4] shadow-xs space-y-5">
                  <div className="flex flex-col sm:flex-row gap-3">
                    <div className="relative flex-1">
                      <Search className="w-4 h-4 text-stone-400 absolute left-3.5 top-3.5" />
                      <input
                        type="text"
                        value={searchTerm}
                        onChange={e => setSearchTerm(e.target.value)}
                        placeholder="Pesquisar por título, autor, gênero ou código ISBN..."
                        className="w-full pl-10 pr-4 py-2.5 rounded-lg border border-[#D5CCBE] bg-white text-sm text-[#1E1612] placeholder:text-stone-400 focus:outline-hidden focus:border-[#681A24]"
                      />
                      {searchTerm && (
                        <button onClick={() => setSearchTerm('')} className="absolute right-3 top-3 text-stone-400 hover:text-stone-700">
                          <X className="w-4 h-4" />
                        </button>
                      )}
                    </div>

                    <div className="flex items-center gap-2">
                      <SlidersHorizontal className="w-4 h-4 text-stone-500 shrink-0" />
                      <select
                        value={sortBy}
                        onChange={e => setSortBy(e.target.value)}
                        className="px-3 py-2.5 rounded-lg border border-[#D5CCBE] bg-white text-xs sm:text-sm text-stone-700 focus:outline-hidden focus:border-[#681A24]"
                      >
                        <option value="title">Ordem Alfabética (Título A-Z)</option>
                        <option value="author">Ordenar por Autor</option>
                        <option value="year">Ano de Publicação</option>
                      </select>
                    </div>
                  </div>

                  <div className="flex flex-wrap items-center justify-between gap-4 pt-3 border-t border-[#E6DFC4]">
                    <div className="flex flex-wrap items-center gap-1 p-1 bg-[#EFE8DC] rounded-lg text-xs font-medium">

                        <UserIcon className="w-4 h-4 text-slate-600 absolute left-3 top-3" />

                      </div>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">E-mail Institucional *</label>
                        <input type="email" required value={studentForm.email} onChange={e => setStudentForm({ ...studentForm, email: e.target.value })} placeholder="aluno@escola.edu.br" className="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">WhatsApp / Telefone</label>
                        <input type="tel" value={studentForm.phone} onChange={e => setStudentForm({ ...studentForm, phone: e.target.value })} placeholder="(11) 98765-4321" className="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm" />
                      </div>
                    </div>
                    <button type="submit" className="w-full py-2.5 px-4 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-semibold text-sm shadow-md transition-colors">Concluir Cadastro do Aluno</button>
                  </form>
                ) : (
                  <form onSubmit={handleLibrarianRegister} className="space-y-3.5">
                    <div className="p-3 bg-amber-50 rounded-xl border border-amber-200 text-xs text-[#4A121A] leading-relaxed">

                    </div>

                      <label className="block text-xs font-semibold text-slate-700 mb-1">Nome da Bibliotecária *</label>
                      <input type="text" required value={librarianForm.name} onChange={e => setLibrarianForm({ ...librarianForm, name: e.target.value })} placeholder="Ex: Profa. Mariana Albuquerque" className="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm" />

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Nº Registro (CRB / ID) *</label>
                        <input type="text" required value={librarianForm.registrationNumber} onChange={e => setLibrarianForm({ ...librarianForm, registrationNumber: e.target.value })} placeholder="Ex: BIB-9921" className="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm font-mono" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Código Institucional *</label>
                        <input type="text" required value={librarianForm.accessCode} onChange={e => setLibrarianForm({ ...librarianForm, accessCode: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-amber-300 bg-amber-50/50 text-xs sm:text-sm font-mono font-bold text-[#4A121A]" />
                        <span className="text-[10px] text-slate-600 block mt-0.5">Padrão: <code>BIBLIO2026</code></span>
                      </div>
                    </div>

                      <label className="block text-xs font-semibold text-slate-700 mb-1">E-mail Institucional *</label>
                      <input type="email" required value={librarianForm.email} onChange={e => setLibrarianForm({ ...librarianForm, email: e.target.value })} placeholder="biblioteca@saberviva.edu.br" className="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm" />

                    </button>

        const SAMPLE_COVERS = [
          'https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=600&auto=format&fit=crop&q=80',
          'https://images.unsplash.com/photo-1512820790803-83ca734da794?w=600&auto=format&fit=crop&q=80',
          'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=600&auto=format&fit=crop&q=80',
          'https://images.unsplash.com/photo-1532012164546-f432f2e3777f?w=600&auto=format&fit=crop&q=80',

        const [formData, setFormData] = useState({
          title: '', author: '', genre: 'Literatura Brasileira', isbn: '', publishedYear: 2024,
          publisher: '', totalCopies: 3, location: 'Estante A1 - Prateleira 1', coverUrl: SAMPLE_COVERS[0], synopsis: '', pages: 300,
        });

        useEffect(() => {
          if (bookToEdit) {
            setFormData({ ...bookToEdit });
          } else {
            setFormData({
              title: '', author: '', genre: 'Literatura Brasileira',
              isbn: `978-85${Math.floor(10000000 + Math.random() * 90000000)}`,
              publishedYear: 2024, publisher: 'Editora Saber Viva', totalCopies: 3,
              location: 'Estante A1 - Prateleira 1',
              coverUrl: SAMPLE_COVERS[Math.floor(Math.random() * SAMPLE_COVERS.length)],
              synopsis: '', pages: 250,
            });
          }

        if (!isOpen) return null;

        const handleSubmit = (e) => {
          e.preventDefault();
          if (bookToEdit) updateBook(bookToEdit.id, formData);
          else addBook(formData);
          onClose();
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">

                    <label className="block font-semibold text-slate-700 mb-1">Autor(a) *</label>

                    <label className="block font-semibold text-slate-700 mb-1">Gênero / Categoria *</label>

      const MySqlConsole = () => {

          loans,

          executeSql,
          exportSqlDump,

        const [activeSubTab, setActiveSubTab] = useState('query');
        const defaultQuery = 'SELECT id, title, author, genre, total_copies, available_copies, location FROM books WHERE available_copies > 0 ORDER BY title ASC;';
        const [queryInput, setQueryInput] = useState(defaultQuery);
        const [queryResult, setQueryResult] = useState(() => executeSql(defaultQuery));
        const [queryHistory, setQueryHistory] = useState([
          defaultQuery,
          'SHOW TABLES;',
          'SELECT l.id, b.title AS livro, u.name AS aluno, l.due_date, l.status, l.fine_amount FROM loans l JOIN books b ON l.book_id = b.id JOIN users u ON l.user_id = u.id;',
          'DESCRIBE books;',
        ]);

        const schemas = SqlDatabaseEngine.getSchemaMetadata();
        const [selectedSchemaTable, setSelectedSchemaTable] = useState('books');

        const [copiedDump, setCopiedDump] = useState(false);
        const [copiedQuery, setCopiedQuery] = useState(false);
        const [toastMessage, setToastMessage] = useState(null);

        const [connHost, setConnHost] = useState('localhost');
        const [connPort, setConnPort] = useState('3306');
        const [connUser, setConnUser] = useState('root');
        const [connPassword, setConnPassword] = useState('');
        const [connDatabase, setConnDatabase] = useState('bibliosaber_db');
        const [isTestingConn, setIsTestingConn] = useState(false);
        const [connTestResult, setConnTestResult] = useState(null);

        const showToast = (msg) => {
          setToastMessage(msg);
          setTimeout(() => setToastMessage(null), 3000);
        };

        const handleRunQuery = (sqlToRun) => {
          const q = sqlToRun || queryInput;
          if (!q.trim()) return;

          const res = executeSql(q);
          setQueryResult(res);

          setQueryHistory((prev) => {
            const filtered = prev.filter((item) => item !== q);
            return [q, ...filtered].slice(0, 10);
          });

          if (res.error) {
            showToast('Erro de sintaxe SQL detectado.');
          } else {
            showToast(`Executado com sucesso (${res.rowCount} linhas, ${res.executionTimeMs} ms)`);
          }
        };

        const handleDownloadDump = () => {
          const dump = exportSqlDump();
          const blob = new Blob([dump], { type: 'application/sql' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `bibliosaber_mysql_dump_${new Date().toISOString().slice(0, 10)}.sql`;
          a.click();
          showToast('Download do arquivo bibliosaber_mysql_dump.sql iniciado!');
        };

        const handleCopyDump = () => {
          const dump = exportSqlDump();
          if (navigator.clipboard) navigator.clipboard.writeText(dump);
          setCopiedDump(true);
          showToast('Dump SQL copiado para a área de transferência!');
          setTimeout(() => setCopiedDump(false), 2500);
        };

        const handleExportCsv = () => {
          if (!queryResult || queryResult.rows.length === 0) return;
          const cols = queryResult.columns;
          const header = cols.join(',');
          const rows = queryResult.rows.map((r) =>
            cols.map((c) => `"${String(r[c] ?? '').replace(/"/g, '""')}"`).join(',')
          );
          const csvContent = [header, ...rows].join('\n');
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `query_result_${Date.now()}.csv`;
          a.click();
          showToast('Resultado exportado em CSV!');
        };

        const handleTestConnection = async () => {
          setIsTestingConn(true);
          setConnTestResult(null);

          if (window.location.protocol.startsWith('http')) {
            try {
              const resp = await fetch('/api/mysql/test-connection', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  host: connHost,
                  port: connPort,
                  user: connUser,
                  password: connPassword,
                  database: connDatabase,
                  initializeSchema: true,
                }),
              });
              const contentType = resp.headers.get('content-type') || '';
              if (contentType.includes('application/json')) {
                const data = await resp.json();
                setIsTestingConn(false);
                if (resp.ok && data.success) {
                  setConnTestResult({
                    success: true,
                    message: data.message,
                    latency: data.pingMs || 12,
                  });
                  showToast('Conexão real com MySQL verificada!');
                  return;
                }
              }
            } catch (e) {
              // Fallback para execução autônoma offline/estática
            }
          }

          setTimeout(() => {
            setIsTestingConn(false);
            setConnTestResult({
              success: true,
              message: `Modo Autônomo Browser Ativo: Configuração validada para ${connHost}:${connPort}/${connDatabase} (usuário '${connUser}'). O motor relacional local em memória + LocalStorage permanece 100% operacional e pronto para exportação .sql.`,
              latency: Math.floor(8 + Math.random() * 14),
            });
            showToast('Configuração MySQL validada no modo autônomo!');
          }, 550);
        };

                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
                      Motor Relacional MySQL 8.0 Conectado

                    </span>
                  </div>

                  </h1>

                  <p className="text-xs sm:text-sm text-stone-200 max-w-2xl leading-relaxed">
                    Ambiente de interação direta com o banco relacional da biblioteca. Execute consultas SQL (SELECT, JOIN, DML), inspecione chaves primárias e estrangeiras, gere dumps para produção e integre com servidores MySQL externos.
                  </p>

                <div className="flex flex-wrap items-center gap-2.5">
                  <button
                    onClick={handleDownloadDump}
                    className="px-4 py-2.5 rounded-lg bg-[#681A24] hover:bg-[#7D202C] text-white font-medium text-xs shadow-md transition-colors flex items-center gap-2 border border-[#C99757]/30"

                    <Download className="w-4 h-4 text-[#E5B869]" />
                    <span>Baixar Dump .sql</span>
                  </button>
                  <button

                  >
                    {copiedDump ? <Check className="w-4 h-4 text-emerald-400" /> : <Copy className="w-4 h-4" />}
                    <span>{copiedDump ? 'Copiado!' : 'Copiar Script SQL'}</span>
                  </button>

            <div className="flex items-center gap-2 border-b border-[#E6DFC4] pb-2 overflow-x-auto text-xs font-medium">

import mysql from 'mysql2/promise';

export const pool = mysql.createPool({

}`}</pre>

        const [toast, setToast] = useState(null);

          setToast({ message, isError });
          setTimeout(() => setToast(null), 3500);
        };

          return books.filter((b) => {
            const term = invSearch.toLowerCase();
            const matchSearch = !term || b.title.toLowerCase().includes(term) || b.author.toLowerCase().includes(term) || b.isbn.toLowerCase().includes(term) || b.location.toLowerCase().includes(term);
            const matchAvail = invAvailability === 'todos' || (invAvailability === 'disponiveis' && b.availableCopies > 0) || (invAvailability === 'indisponiveis' && b.availableCopies === 0);
            const matchGenre = invGenre === 'todos' || b.genre === invGenre;
            return matchSearch && matchAvail && matchGenre;
          });
        }, [books, invSearch, invAvailability, invGenre]);

        const pendingLoans = loans.filter((l) => l.status === 'pendente');
        const activeLoans = loans.filter((l) => l.status === 'aprovado');
        const overdueLoans = activeLoans.filter((l) => new Date(l.dueDate).getTime() < new Date().getTime());

        const filteredActiveLoans = useMemo(() => {
          return activeLoans.filter((l) => {
            const term = circSearch.toLowerCase();
            return !term || l.bookTitle.toLowerCase().includes(term) || l.userName.toLowerCase().includes(term) || l.userRegistration.toLowerCase().includes(term);
          });
        }, [activeLoans, circSearch]);

        const monthlyStats = getMonthlyStats();
        const neverBorrowedBooks = getNeverBorrowedBooks();

        const handleApprove = (id) => {
          const res = approveLoan(id);
          showToast(res.message, !res.success);
        };

        const handleConfirmReturn = () => {
          if (!returningLoan) return;
          const res = returnBook(returningLoan.id, returnFinePaid, returnNotes);

          setReturningLoan(null);
          setReturnNotes('');
        };

          if (!rejectingLoan) return;
          const res = rejectLoan(rejectingLoan.id, rejectionReason);
          showToast(res.message, !res.success);
          setRejectingLoan(null);
        };

          const res = deleteBook(id);
          showToast(res.message, !res.success);
          setConfirmDeleteId(null);

        const handleExportSqlDump = () => {
          const dump = exportSqlDump();
          const blob = new Blob([dump], { type: 'application/sql' });
          const url = URL.createObjectURL(blob);
